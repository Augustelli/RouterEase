$kind: http-request
method: POST
url: '{{base_url}}/api/v1/routers/{{router_id}}/devices'
order: 2000
headers: [{key: Content-Type, value: application/json}]
body:
  type: json
  content: |-
    { "name": "Child device", "mac_address": "02:00:00:00:00:01" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("child created", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("child_device_id", pm.response.json().id);
