$kind: http-request
method: POST
url: '{{base_url}}/api/v1/routers/{{router_id}}/groups'
order: 4000
headers: [{key: Content-Type, value: application/json}]
body:
  type: json
  content: |-
    { "name": "Children", "description": "Postman test group" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("group created", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("group_id", pm.response.json().id);
