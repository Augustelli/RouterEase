services:
  auth_db:
    image: postgres:alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - ./keycloak-data:/var/lib/postgresql/data
    networks:
      - backend-network

  authentication:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "33333:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Pv7031Qv3L3e 
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /routerease/user
      KC_HOSTNAME: augustomancuso.com
      KC_HOSTNAME_URL: http://augustomancuso.com
      KEYCLOAK_FRONTEND_URL: http://augustomancuso.com/routerease/user

    command: start-dev
    depends_on:
      - auth_db
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.authentication.loadbalancer.server.port=8080"
      - "traefik.http.routers.authentication.middlewares=cors-all@file"
      - "traefik.http.routers.authentication.entrypoints=http"         
      - "traefik.http.routers.authentication.rule=PathPrefix(`/routerease/user`)"
    networks:
      - backend-network
