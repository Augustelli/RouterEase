services:
  auth_db:
    image: postgres:16.8-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - ./keycloak-data:/var/lib/postgresql/data
    networks:
      - backend-network

  authentication:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth_db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /routerease/user
    command: start-dev
    depends_on:
      - auth_db
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.authentication.loadbalancer.server.port=8080"
      - "traefik.http.routers.authentication.middlewares=cors-all@file"
      - "traefik.http.routers.authentication.entrypoints=http"
      - "traefik.http.routers.authentication.rule=PathPrefix(`/routerease/user`)"
    networks:
      - backend-network
